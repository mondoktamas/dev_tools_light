name: dev_tools_light
description: >-
  In-app Flutter leak detection with LeakCanary-style traces, heap growth
  trends and jank attributed to your own code, built on the Dart VM service.
version: 0.1.1
repository: https://github.com/mondoktamas/dev_tools_light
issue_tracker: https://github.com/mondoktamas/dev_tools_light/issues
topics:
  - memory
  - leak-detection
  - performance
  - debugging
  - devtools

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  collection: ^1.19.0
  flutter:
    sdk: flutter
  meta: ^1.16.0
  vm_service: ^15.0.0
  vm_service_protos: ^2.0.1

dev_dependencies:
  fake_async: ^1.3.3
  fixnum: ^1.1.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0
